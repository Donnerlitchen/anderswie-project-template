# Vorlage-Platzhalter — beim Anlegen eines Projekts ausfüllen.
#
# Eine Regel, ein Ort: Die Version steht **nur hier** (STANDARD.md §1). Gibt der Code eine zweite
# Version aus (`__version__`), muss sie zu diesem Wert passen — sonst laufen zwei Zahlen auseinander
# und es fällt erst im Build auf.
#
# Ebenfalls auszufüllen: name, description. `version` darf auf 0.1.0 stehen bleiben; sie zählt ab
# der ersten abgenommenen Änderung (siehe VERSIONING.md).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anderswie-<projekt>"
version = "0.1.0"
description = "<PROJEKT> — Kurzbeschreibung in einem Satz"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest"]

# Quellcode liegt unter src/ — dieselbe Annahme prüfen `scripts/gates.sh` und die Modulkarte.
[tool.setuptools.packages.find]
where = ["src"]
